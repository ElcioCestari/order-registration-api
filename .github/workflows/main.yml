name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      # Tests start MongoDB and Redis with Testcontainers, using the runner's Docker
      - name: Test and check style
        run: ./mvnw -B verify
